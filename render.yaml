# Blueprint de despliegue en Render (backend + Postgres + frontend estático,
# una sola cuenta). Ver docs/despliegue-render.md para el procedimiento
# completo. El primer despliegue sigue siendo manual (aplicar el DDL +
# --bootstrap + cargar el seed contra la base gestionada: Render no tiene
# docker-entrypoint-initdb.d). Las migraciones *posteriores* las aplica
# preDeployCommand antes de conmutar trafico (issue #83).
#
# El backend y la base quedan en la misma región para hablarse por red
# privada. El sitio estático no acepta región (se sirve por CDN global).
# Plan "starter"/"basic-256mb" en backend y DB -- elegido por costo-beneficio
# (~$14/mes backend+DB), no por ser el más barato posible: ver
# docs/despliegue-render.md para la comparación frente a Railway/Fly.io/Vercel.

databases:
  - name: epi-aetheris-db
    databaseName: epi_aetheris
    user: aetheris_user
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "15"
    # Lista vacía: solo se llega a la base por la red interna de Render. Con
    # cuentas en la base (ADR 0024) no se deja abierta a internet.
    ipAllowList: []

services:
  - type: web
    name: epi-aetheris-backend
    runtime: docker
    plan: starter
    region: oregon
    # main es la rama de release: el deploy se dispara solo al mergear en
    # main (dev es integración y la rama por defecto del repo). Ver AGENTS.md
    # §15. Explícito aquí para que no dependa de la rama por defecto de GitHub.
    branch: main
    # Contexto = raiz del repo para copiar db/aplicar_migraciones.py y
    # db/migrations/ dentro de la imagen. docker-compose sigue construyendo
    # backend/Dockerfile con contexto ./backend.
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    # Dockerfile.render ya no usa --reload (ese flag es del Dockerfile de
    # compose, con bind mount). Se deja dockerCommand explicito por si el
    # Blueprint se sincroniza contra una imagen vieja.
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    # Corre en una instancia de la imagen recien construida, con las mismas
    # POSTGRES_* que el servicio, antes de conmutar trafico. Si falla, el
    # deploy no avanza y sigue viva la version anterior.
    preDeployCommand: python db/aplicar_migraciones.py
    healthCheckPath: /health
    envVars:
      # Roles de base de datos (ADR 0024, punto E; guia paso a paso en
      # docs/seguridad/roles-de-base-de-datos.md). Los valores los pone una
      # persona en el panel de Render; ninguno se versiona.
      #   DATABASE_URL: rol de aplicacion (epi_app), el de la API. Sin
      #     privilegios de esquema ni de modificacion de la auditoria.
      #   DATABASE_URL_MIGRACIONES: rol propietario del esquema, que usa solo
      #     el preDeployCommand. Si falta, el runner usa DATABASE_URL y, si
      #     tampoco existe, las POSTGRES_* de abajo.
      # Mientras DATABASE_URL no se defina, la API sigue con POSTGRES_*. Cuando
      # el rol de aplicacion lleve un tiempo funcionando se retiran
      # POSTGRES_USER y POSTGRES_PASSWORD de este bloque.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRACIONES
        sync: false
      - key: POSTGRES_HOST
        fromDatabase:
          name: epi-aetheris-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: epi-aetheris-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: epi-aetheris-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: epi-aetheris-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: epi-aetheris-db
          property: password
      # Orígenes desde los que el navegador puede llamar a la API: el sitio
      # canónico (servicio estático "aetheris-nitor", que sincroniza web/) y su
      # www, que Render redirige al dominio sin www. Las direcciones
      # onrender.com del sitio ya no van aquí: el Layout las redirige al
      # dominio canónico antes de que haga ninguna petición (ADR 0024, punto
      # B). El control de Origin de las rutas de cuenta (AUTH_ORIGEN_CANONICO)
      # solo acepta el dominio canónico.
      - key: CORS_ALLOWED_ORIGINS
        value: https://epi-aetheris.dev,https://www.epi-aetheris.dev
      # /docs, /redoc y /openapi.json apagados en producción (ADR 0024).
      - key: API_DOCS_ENABLED
        value: "false"
      # Escritura de alertas (ADR 0015). Render lo pide en el panel; no
      # se versiona un valor. Sin él, POST/PATCH responden 503.
      - key: ALERTAS_TOKEN
        sync: false
      # Cuentas de usuario (ADR 0024), activas desde 2026-10-04. Los secretos
      # los pone una persona en el panel de Render; ninguno se versiona.
      - key: CUENTAS_HABILITADAS
        value: "true"
      # Proxies de confianza delante de la API. X-Forwarded-For llega con dos
      # entradas (la persona y el Cloudflare de la plataforma): con 2 se toma la
      # IP de la persona; con 1 se tomaba la de Cloudflare. Medido en /cuenta.
      - key: TRUSTED_PROXY_DEPTH
        value: "2"
      - key: AUTH_ORIGEN_CANONICO
        value: https://epi-aetheris.dev
      - key: AUTH_RP_ID
        value: epi-aetheris.dev
      - key: AUTH_PEPPERS
        sync: false
      - key: AUTH_CLAVES_CIFRADO
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_CLAVE
        sync: false
