name: Backend tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      # Sin volumes aqui a proposito: un volume que apunte a un path de
      # github.workspace se monta ANTES del checkout (los contenedores de
      # servicio arrancan antes que los steps), asi que Docker crea ese
      # directorio vacio con permisos que el runner no puede borrar despues
      # al clonar -- "EACCES: permission denied, rmdir db/migrations"
      # (confirmado en la corrida 32669784885). Las migraciones y el seed se
      # aplican explicitamente mas abajo, despues del checkout, via psql.
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aetheris_user
          POSTGRES_PASSWORD: aetheris_ci_password
          POSTGRES_DB: epi_aetheris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aetheris_user -d epi_aetheris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: aetheris_user
      POSTGRES_PASSWORD: aetheris_ci_password
      POSTGRES_DB: epi_aetheris
      PGPASSWORD: aetheris_ci_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install --require-hashes -r requirements.txt -r requirements-ingesta.txt -r requirements-dev.txt

      - name: Aplicar migraciones y seed de datos reales
        run: |
          set -e
          for f in db/migrations/*.sql; do
            echo "-- $f"
            psql -h localhost -U aetheris_user -d epi_aetheris -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U aetheris_user -d epi_aetheris -v ON_ERROR_STOP=1 -f db/seed/seed_datos_reales.sql

      - name: Correr suite pytest
        working-directory: backend
        run: python -m pytest ingestion/tests/ api/tests/ -v
