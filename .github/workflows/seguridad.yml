name: Seguridad

# Comprobaciones de la cadena de suministro y de secretos (ADR 0024). Corren en
# cada PR y cada semana, porque una dependencia puede volverse vulnerable sin
# que nadie toque el repositorio.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  dependencias:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Auditar dependencias del backend
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt -r backend/requirements-ingesta.txt -r backend/requirements-dev.txt

  secretos:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # Suma publicada en gitleaks_8.30.1_checksums.txt de la misma versión.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Buscar secretos en el historial
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Auditar los workflows de GitHub Actions
        run: |
          pip install zizmor==1.30.1
          zizmor --offline --no-progress --min-severity medium .github/workflows
