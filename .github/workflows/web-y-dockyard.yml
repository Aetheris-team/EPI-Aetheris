name: Sitio estático

on:
  push:
    branches: [main, dev, migration/static-site]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  web:
    name: Exportación, compilación y pruebas del sitio
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:8401
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Exportar el corte
        run: ./scripts/exportar-datos-estaticos.sh

      - name: Comprobar y compilar
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm test:unit
          pnpm build

      - name: Comprobar el arranque estático en el puerto de Dockyard
        run: |
          set -euo pipefail
          docker compose config --format json | jq -e '
            (.services | keys) == ["web"]
            and (.services.web.ports | map(.published | tostring)) == ["8401"]
            and (.services.web | has("container_name") or has("profiles") or .privileged == true or .network_mode == "host" | not)
          '
          docker compose up -d --build --wait --wait-timeout 600
          for ruta in / /dengue /respiratorio /alertas /biblioteca /estado /datos/alertas/feed.xml; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8401$ruta")
            [ "$codigo" = 200 ] || { echo "::error::$ruta devuelve $codigo"; exit 1; }
          done
          curl -fsS http://localhost:8401/datos/casos-nacional.json | jq -e 'length > 0'
          curl -fsS http://localhost:8401/datos/corte.json | jq -e '.version and .fecha'
          for ruta in /api/casos-nacional /health /cuenta /admin/usuarios /alertas/nueva; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8401$ruta")
            [ "$codigo" = 404 ] || { echo "::error::$ruta devuelve $codigo"; exit 1; }
          done

      - name: Probar la edición estática y la navegación
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e '/(estatico|estado|cuenta-deshabilitada|alertas|alertas-territorio|enfoque-dual|analisis|clima-dengue|departamento|respiratorio)\.spec\.ts$'

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sitio-estatico
          path: web/dist/
          if-no-files-found: error
          include-hidden-files: true

      - name: Registro si algo falló
        if: failure()
        run: docker compose logs --tail 100

      - name: Apagar el sitio
        if: always()
        run: docker compose down --volumes
