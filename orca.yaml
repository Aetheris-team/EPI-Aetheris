# Nota: docker-compose.yml usa container_name y puertos fijos (5432/8000/4321),
# compartidos a nivel del daemon Docker del host, no por worktree. Solo un
# worktree a la vez debe correr `docker compose up` — ver AGENTS.md,
# sección 17, "Comandos" (punto "Multi-worktree (Orca ADE)").
scripts:
  setup: |
    python3 -m venv backend/.venv
    backend/.venv/bin/pip install -r backend/requirements.txt
    corepack enable
    cd web && pnpm install

worktree:
  sharedDirectories:
    - backend/.venv
    - web/node_modules
    - backend/ingestion/data/raw
    - backend/ingestion/data/interim
