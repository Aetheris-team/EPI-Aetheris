# Sitio estático de Astro.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Si alguna vez redirige, que la Location sea relativa: con la absoluta
    # nginx pondría su puerto interno (80) y el navegador, que entró por el
    # 8401, terminaría en http://localhost/... sin respuesta.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /datos/ {
        types {
            application/atom+xml xml;
            application/json json;
        }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Astro genera /alertas/index.html y el sitio enlaza a /alertas, sin barra.
    # Se sirve directo, sin 301: el service worker reenvía las navegaciones con
    # fetch() y Chrome no acepta una respuesta redirigida para una navegación
    # (net::ERR_FAILED).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
