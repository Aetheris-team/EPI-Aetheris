# Sitio estático de Astro + reenvío de la API al backend del mismo compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /alertas -> /alertas/ con Location relativa. Con la absoluta, nginx
    # pondría su puerto interno (80) y el navegador, que entró por el 8401,
    # terminaría en http://localhost/alertas/ sin respuesta.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # El backend es el servicio "backend" del compose. El resolver de Docker
    # con una variable evita que nginx falle al arrancar si el backend todavía
    # no tiene dirección.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $backend;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
